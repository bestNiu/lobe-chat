# Opt-in include for a protected, dedicated, non-root shell Runner with local Docker.
# Not activated remotely by committing this template. See scripts/youlin/docker/README.md.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

stages: [verify]

youlin:isolated-verification:
  stage: verify
  tags: [youlin-private-docker]
  resource_group: youlin-isolated-verification
  timeout: 15m
  script:
    - mkdir -p .youlin-ci-evidence
    - node scripts/youlin/dockerNode.mjs -- node --test /workspace/scripts/youlin/dockerRuntime.smoke.mjs > .youlin-ci-evidence/runtime.txt 2>&1
    - node scripts/youlin/nodePostgres.smoke.mjs --sql > .youlin-ci-evidence/sql.txt 2>&1
    - node scripts/youlin/nodePostgres.smoke.mjs > .youlin-ci-evidence/nodepg.txt 2>&1
    - node scripts/youlin/identity.smoke.mjs > .youlin-ci-evidence/identity.txt 2>&1
    - node scripts/youlin/dockerNode.mjs --check --test packages/database/src/experimental/youlinSecurity/__tests__/reader.test.ts packages/database/src/experimental/youlinSecurity/__tests__/ownedReader.test.ts > .youlin-ci-evidence/database.txt 2>&1
    - node scripts/youlin/dockerNode.mjs -- node /workspace/node_modules/vitest/vitest.mjs run --project=server --pool=threads --maxWorkers=1 apps/server/src/modules/YoulinSecurity/__tests__/revocationGate.test.ts apps/server/src/modules/YoulinIdentity/__tests__/keycloakAccessVerifier.test.ts > .youlin-ci-evidence/server.txt 2>&1
    - node scripts/youlin/dockerNode.mjs --docs -- python3 docs/youlin-enterprise-ai-platform/plan/validate_docs.py > .youlin-ci-evidence/docs.txt 2>&1
  artifacts:
    when: always
    access: developer
    paths: [.youlin-ci-evidence/]
    expire_in: 7 days
# The seven-day TTL applies only to synthetic CI logs, not corporate audit/record retention.
# This selected verification job does not represent the full repository type/build gate.
