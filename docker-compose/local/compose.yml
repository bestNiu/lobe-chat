name: youlin-v2

services:
  lobe:
    image: ${YOULIN_IMAGE:-youlin-v2:6c7a6fb033}
    ports:
      - '127.0.0.1:33210:3210'
    env_file:
      - ${YOULIN_ENV_FILE:?Set YOULIN_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Required}
      DATABASE_DRIVER: node
      INTERNAL_APP_URL: http://localhost:3210
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: youlin-v2
      REDIS_TLS: '0'
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_BUCKET: lobe
      S3_ENABLE_PATH_STYLE: '1'
      S3_SET_ACL: '0'
      LLM_VISION_IMAGE_USE_BASE64: '1'
      SEARXNG_URL: http://searxng:8080
      ENABLE_AGENT_GATEWAY: '1'
      AGENT_GATEWAY_INTERNAL_URL: http://gateway:8787
      AGENT_GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Required}
      DEVICE_GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Required}
      DEVICE_GATEWAY_URL: http://gateway:8788
      # Internal market proxy (phase 1): five endpoints answered locally, the
      # rest proxied upstream. The app itself is unchanged.
      MARKET_BASE_URL: http://market:8789
      MARKET_TRUSTED_CLIENT_ID: ${MARKET_TRUSTED_CLIENT_ID:?Required}
      MARKET_TRUSTED_CLIENT_SECRET: ${MARKET_TRUSTED_CLIENT_SECRET:?Required}
      # The app installs skills by fetching the proxy's download URL, and
      # ssrf-safe-fetch blocks private IPs by default. Allow exactly the proxy.
      SSRF_ALLOW_IP_ADDRESS_LIST: ${MARKET_SSRF_ALLOW_LIST:-market}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          '/bin/node',
          '-e',
          'fetch("http://127.0.0.1:3210/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 6
    restart: unless-stopped

  postgresql:
    image: paradedb/paradedb:latest-pg17
    environment:
      POSTGRES_DB: lobehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - '127.0.0.1:33212:9000'
      - '127.0.0.1:33213:9001'
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Required}
    volumes:
      - objects:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:9000/health >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Required}
    volumes:
      - ../deploy/bucket.config.json:/bucket.config.json:ro
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        rc alias set local http://rustfs:9000 \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null
        rc mb local/lobe --ignore-existing
        rc anonymous set-json /bucket.config.json local/lobe
        printf '%s' '<CORSConfiguration><CORSRule>' \
          '<AllowedOrigin>http://localhost:33210</AllowedOrigin>' \
          '<AllowedMethod>GET</AllowedMethod>' \
          '<AllowedMethod>PUT</AllowedMethod>' \
          '<AllowedMethod>HEAD</AllowedMethod>' \
          '<AllowedHeader>*</AllowedHeader>' \
          '<ExposeHeader>ETag</ExposeHeader>' \
          '<MaxAgeSeconds>3600</MaxAgeSeconds>' \
          '</CORSRule></CORSConfiguration>' | rc bucket cors set local/lobe -
    restart: 'no'

  gateway:
    image: ghcr.io/lobehub/lobehub-gateway:0.3.2
    ports:
      - '127.0.0.1:33217:8787'
      - '127.0.0.1:33218:8788'
    environment:
      SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Required}
      JWKS_PUBLIC_KEY: ${JWKS_PUBLIC_KEY:?Required}
      LOBE_API_BASE_URL: http://lobe:3210
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ../deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Internal market proxy: keeps a warm snapshot of the public catalogue and
  # answers the endpoints the upstream market refuses for machine tokens
  # (detail / fork / skill download).
  market:
    image: ${MARKET_IMAGE:-youlin-market:dev}
    build:
      context: ../..
      dockerfile: apps/market/Dockerfile
    ports:
      - '127.0.0.1:33220:8789'
    environment:
      MARKET_TRUSTED_CLIENT_ID: ${MARKET_TRUSTED_CLIENT_ID:?Required}
      MARKET_TRUSTED_CLIENT_SECRET: ${MARKET_TRUSTED_CLIENT_SECRET:?Required}
      UPSTREAM_MARKET_URL: ${MARKET_UPSTREAM_URL:-https://market.lobehub.com}
      MARKET_PUBLIC_BASE_URL: ${MARKET_PUBLIC_BASE_URL:-http://localhost:33220}
      M2M_STATE_PATH: /data/m2m-client.json
      SNAPSHOT_DIR: /data/snapshot
      SNAPSHOT_ENABLED: '1'
      SNAPSHOT_PER_CATEGORY: '100'
      SNAPSHOT_PREFETCH_CONCURRENCY: '4'
      SNAPSHOT_AGENTS_INTERVAL_MS: '600000'
      SNAPSHOT_PLUGINS_INTERVAL_MS: '1800000'
      SNAPSHOT_SKILLS_INTERVAL_MS: '3600000'
      SKILL_DOWNLOAD_PROXY_MODE: redirect
      MCP_ALLOW_STDIO: '0'
    volumes:
      - market-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8789/health']
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # One-shot secret bootstrap. Run it once, then copy the printed pair into the
  # deployment env file (MARKET_TRUSTED_CLIENT_ID / _SECRET). Keeping the secret
  # out of compose files is deliberate: it signs every trusted-client token.
  market-keygen:
    image: busybox:latest
    volumes:
      - market-secrets:/secrets
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ ! -f /secrets/market.env ]; then
          HEX="$$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')"
          KEY="lobehub-market_tcs_$$HEX"
          printf 'MARKET_TRUSTED_CLIENT_ID=youlin-internal-market\n' \
            > /secrets/market.env
          printf 'MARKET_TRUSTED_CLIENT_SECRET=%s\n' "$$KEY" \
            >> /secrets/market.env
          chmod 600 /secrets/market.env
        fi
        cat /secrets/market.env
    restart: 'no'

volumes:
  database: {}
  redis: {}
  objects: {}
  market-data: {}
  market-secrets: {}
